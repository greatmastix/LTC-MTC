name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to attach binaries to a release when a v* tag is pushed

jobs:
  build:
    # The app targets Windows, but the .NET SDK cross-builds it from Linux (EnableWindowsTargeting),
    # which is faster and uses half the Actions minutes of a Windows runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/LtcMtc.Tests -c Release

      # A v1.2.3 tag builds version 1.2.3 (shown in About); other builds keep the project's version.
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION_ARG=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi

      # Not compressed, and nothing extracted to a temp folder at launch: self-extracting, compressed executables look
      # like packed malware to antivirus and browser heuristics. The download is zipped anyway.
      - name: Publish standalone (no .NET install needed)
        run: >
          dotnet publish src/LtcMtc -c Release --self-contained $VERSION_ARG
          -p:PublishSingleFile=true -p:DebugType=none -o out/standalone

      - name: Publish small (needs the .NET 10 Desktop Runtime)
        run: >
          dotnet publish src/LtcMtc -c Release --no-self-contained $VERSION_ARG
          -p:PublishSingleFile=true -p:DebugType=none -o out/framework

      - uses: actions/upload-artifact@v7
        with:
          name: LtcMtc-win-x64
          path: out/standalone/LtcMtc.exe

      - uses: actions/upload-artifact@v7
        with:
          name: LtcMtc-win-x64-framework-dependent
          path: out/framework/LtcMtc.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd out
          (cd standalone && zip ../LtcMtc-win-x64.zip LtcMtc.exe)
          (cd framework && zip ../LtcMtc-win-x64-framework-dependent.zip LtcMtc.exe)
          gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --title "LTC ⇄ MTC ${GITHUB_REF_NAME}" --generate-notes \
            LtcMtc-win-x64.zip LtcMtc-win-x64-framework-dependent.zip
        env:
          GH_TOKEN: ${{ github.token }}
