name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to attach binaries to a release when a v* tag is pushed

jobs:
  build:
    # The app targets Windows, but the .NET SDK cross-builds it from Linux (EnableWindowsTargeting),
    # which is faster and uses half the Actions minutes of a Windows runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/LtcMtc.Tests -c Release

      - name: Publish standalone (no .NET install needed)
        run: >
          dotnet publish src/LtcMtc -c Release --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -o out/standalone

      - name: Publish small (needs the .NET 10 Desktop Runtime)
        run: >
          dotnet publish src/LtcMtc -c Release --no-self-contained
          -p:PublishSingleFile=true -p:DebugType=none -o out/framework

      - uses: actions/upload-artifact@v4
        with:
          name: LtcMtc-win-x64
          path: out/standalone/LtcMtc.exe

      - uses: actions/upload-artifact@v4
        with:
          name: LtcMtc-win-x64-framework-dependent
          path: out/framework/LtcMtc.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd out
          (cd standalone && zip ../LtcMtc-win-x64.zip LtcMtc.exe)
          (cd framework && zip ../LtcMtc-win-x64-framework-dependent.zip LtcMtc.exe)
          gh release create "$GITHUB_REF_NAME" --generate-notes LtcMtc-win-x64.zip LtcMtc-win-x64-framework-dependent.zip
        env:
          GH_TOKEN: ${{ github.token }}
